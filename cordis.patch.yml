# Portable bundle patch for dsh-billing-stats.
#
# The plugin resolves its bundled pricing catalog from its own package directory.
# The usage ledger and search state default to files inside the installed package;
# set ledgerPath / searchStatePath in the profile patch when durable user-owned
# storage is required. Search-ledger correlation is opt-in because its path is
# specific to each search shim deployment.
- insert:
    - id: billing-attribution
      # Stable internal id kept for existing profile config compatibility.
      name: dsh-billing-stats
      config:
        displayCurrency: CNY
        # Optional request-level bill JSONL produced by `npm run bill:import`.
        # billDetailPath: '<writable data directory>/bill.normalized.jsonl'
        searchLedgerEnabled: false
        activeProfile: auto
        maxRecentRequests: 20
